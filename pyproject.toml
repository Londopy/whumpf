[project]
name = "whumpf"
version = "0.2.0"
description = "Avalanche bulletins projected onto 3D terrain"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "numpy>=1.26",
    "rasterio>=1.3",
    "pystac-client>=0.7",
    "planetary-computer>=1.0",
    "requests>=2.31",
    "flask>=3.0",
    "flask-cors>=4.0",
    "python-dotenv>=1.0",
    "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
whumpf = "pipeline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pipeline", "api", "api.bulletin"]

[tool.ruff]
line-length = 100
target-version = "py311"

# Pin the rule set explicitly. Relying on ruff's defaults makes CI results
# depend on whichever ruff version happens to be installed.
[tool.ruff.lint]
select = [
    "E4",  # imports
    "E7",  # statements
    "E9",  # runtime errors
    "F",   # pyflakes
    "I",   # import sorting
]

[tool.pytest.ini_options]
testpaths = ["tests"]
